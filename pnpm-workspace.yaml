allowBuilds:
  # sentry-cli downloads its binary in postinstall; the vite plugin shells out
  # to it for source-map upload
  "@sentry/cli": true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
